<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock: Multiple Choice</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
<div id="page-wrapper" class="container">
    <header id="page-header">
        <nav aria-label="Navigation">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="#">Mock Subject</a></li>
                <li class="breadcrumb-item"><span>Question 2</span></li>
            </ol>
        </nav>
        <h1>Mock Quiz Session</h1>
    </header>

    <div id="page-content">
        <div id="region-main">
            <h2>General Programming Quiz</h2>
            <div role="main">
                <form action="#" method="post" id="responseform">
                    <div id="question-2" class="que multichoice">
                        <div class="info">
                            <h3 style="margin: 0 0 1rem 0; font-size: 0.875rem; text-transform: uppercase; color: var(--secondary);">Question 2</h3>
                        </div>
                        <div class="content">
                            <div class="qtext">
                                <p>Which of these are programming languages? (Select multiple)</p>
                            </div>
                            <div class="answer">
                                <div class="r0">
                                    <input type="checkbox" name="q2_a0" value="0" id="q2_a0">
                                    <label for="q2_a0">
                                        <span class="answernumber">a.</span>
                                        <span>Python</span>
                                    </label>
                                </div>
                                <div class="r1">
                                    <input type="checkbox" name="q2_a1" value="1" id="q2_a1">
                                    <label for="q2_a1">
                                        <span class="answernumber">b.</span>
                                        <span>HTML (Markup)</span>
                                    </label>
                                </div>
                                <div class="r0">
                                    <input type="checkbox" name="q2_a2" value="2" id="q2_a2">
                                    <label for="q2_a2">
                                        <span class="answernumber">c.</span>
                                        <span>C#</span>
                                    </label>
                                </div>
                                <div class="r1">
                                    <input type="checkbox" name="q2_a3" value="3" id="q2_a3">
                                    <label for="q2_a3">
                                        <span class="answernumber">d.</span>
                                        <span>Coffee</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
