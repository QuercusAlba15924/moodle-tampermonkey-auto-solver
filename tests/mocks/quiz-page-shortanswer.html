<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Quiz - Short Answer</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="jsenabled">

    <header id="page-header">
        <h1>Mock Course</h1>
    </header>

    <div id="page-content">
        <div id="region-main">
            <h2>General Knowledge Quiz</h2>
            <form action="#" method="post" id="responseform">
                <div>
                    <div id="question-1-1" class="que shortanswer deferredfeedback notyetanswered">
                        <div class="info">
                            <h3 class="no">Question <span class="qno">1</span></h3>
                            <div class="state">Not yet answered</div>
                            <div class="grade">Marked out of 1.00</div>
                        </div>
                        <div class="content">
                            <div class="formulation clearfix">
                                <h4 class="accesshide">Question text</h4>
                                <div class="qtext">
                                    <p>What is the capital of France?</p>
                                </div>
                                <div class="ablock d-flex flex-wrap align-items-center">
                                    <label for="q1:1_answer">Answer: 
                                        <span class="answer">
                                            <input type="text" name="q1:1_answer" id="q1:1_answer" size="80" class="form-control d-inline">
                                        </span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="submitbtns">
                    <input type="submit" name="next" value="Next page" class="mod_quiz-next-nav">
                </div>
            </form>
        </div>
    </div>

</body>
</html>
